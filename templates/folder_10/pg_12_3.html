<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .box {
        width: 50%;
        min-width: 700px;
        background: lightblue;
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <!-- when 'width:50%' is specified -->
    <!-- the container normally takes 50% of its parent width -->
    <!-- but it will not shrink below 700px, no matter how small the screen gets -->

    <!-- when no specific width is specified -->
    <!-- the container normally takes 100% of its parent width  -->
    <!-- but it will not shrink below 700px, no matter how small the screen gets -->
    <div class="box">
      Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ullam, esse? Eum
      assumenda quisquam commodi rerum, suscipit explicabo expedita sunt aperiam
      sit at distinctio est voluptas voluptatibus quod id eius harum?
    </div>
  </body>
</html>
