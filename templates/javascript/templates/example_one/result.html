<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Calculator - Result</title>
</head>
<body>
    <h1>Calculation Results</h1>
    <p>Sum: <span id="sum"></span></p>
    <p>Difference: <span id="difference"></span></p>
    <p>Product: <span id="product"></span></p>
    <p>Quotient: <span id="quotient"></span></p>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sum = parseFloat(urlParams.get("sum"));
        const difference = parseFloat(urlParams.get("difference"));
        const product = parseFloat(urlParams.get("product"));
        const quotient = parseFloat(urlParams.get("quotient"));

        document.getElementById("sum").textContent = sum;
        document.getElementById("difference").textContent = difference;
        document.getElementById("product").textContent = product;
        document.getElementById("quotient").textContent = quotient;
    </script>
</body>
</html>
