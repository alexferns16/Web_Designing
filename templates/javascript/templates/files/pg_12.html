<!DOCTYPE html>
<html>
    <head></head>

    <body>
        <p id="demo" style="display:block">This is a text</p>
        <button type="button" onclick="document.getElementById('demo').style.display='none'">Click here to hide</button>
        <button type="button" onclick="document.getElementById('demo').style.display='block'">Click here to show</button>
    </body>
</html>
