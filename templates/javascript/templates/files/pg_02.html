<!DOCTYPE html>

<html>
    <head>
        <script>
            function myFunction() {
                document.getElementById("demo").innerHTML="Paragraph in 1 b changed";
            }
        </script>
    </head>

    <body>
        <h2>Demo JavaScript in Head</h2>
        <p id="demo">Paragraph in 1 b</p>
        <button type="button" onclick="myFunction()">Try it</button>
    </body>
</html>
