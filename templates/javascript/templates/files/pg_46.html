<!DOCTYPE html>
<html>
    <head>

    </head>

    <body>
        <p id="demo_one"></p>
        <p id="demo_two"></p>
        <p id="demo_three"></p>
        <p id="demo_four"></p>

        <label for="car">Enter the attributes required:  </label>
        <input type="text" id="car" name="color">
        <input type="submit" onclick="myFunction()">

        <script>
            const car = {type:"Fiat", model:"500", color:"white"}
            const bus = [10, 20, 30]
            
            document.getElementById("demo_one").innerHTML = car.model;
            document.getElementById("demo_two").innerHTML = bus[0];
            document.getElementById("demo_three").innerHTML = car['color'];

            function myFunction() {
                col = document.getElementById("car").value;
                document.getElementById("demo_four").innerHTML = car[col];
            }
        </script>
    </body>
</html>
