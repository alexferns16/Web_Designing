<!-- without arguments to a function -->

<!DOCTYPE html>
<html>
  <head>
    <script>
      function myFunction_one() {
        p_one = document.getElementById("f_num").value;
        p_two = document.getElementById("s_num").value;
        p_add = Number(p_one) + Number(p_two);
        document.getElementById("demo_one").innerHTML = p_add;
      }
    </script>
  </head>

  <body>
    <p id="demo_one"></p>

    <label for="f_num">First Number: </label>
    <input type="text" id="f_num" name="fnum" />

    <label for="s_num">Second Number: </label>
    <input type="text" id="s_num" name="snum" />

    <input type="submit" onclick="myFunction_one()" />
  </body>
</html>
