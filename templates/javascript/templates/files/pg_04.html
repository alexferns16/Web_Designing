<!DOCTYPE html>
<html>
    <head></head>

    <body>
        <button type="button" onclick="myFunction()">Click Me!</button>

        <p id="demo1"></p>
        <p id="demo2"></p>
        <p id="demo3"></p>
        <p id="demo4"></p>

        <script>

            }
        </script>
    </body>
</html>
