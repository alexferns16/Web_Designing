<!DOCTYPE html>
<html>
    <head>

    </head>

    <body>
        <p id="demo_one"></p>

        <label for="num">Enter Number:  </label>
        <input type="text" id="num" name="number">
        <input type="submit" onclick="myFunction()">

        <script>
            function myFunction() {
                var data = document.getElementById('num').value;

                if (data >= 0) {
                    document.getElementById("demo_one").innerHTML = "The number is positive";
                }
                else {
                    document.getElementById("demo_one").innerHTML = "The number is negative";
                }
            }
        </script>
    </body>
</html>
