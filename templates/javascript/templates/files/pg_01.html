<!DOCTYPE html>
<html>
    <head>
        <style>
            h2 {
                color: crimson;
            }
        </style>
    </head>

    <body>
        <h2>My First JavaScript</h2>

        <button type="button" onclick="document.getElementById('demo_a').innerHTML = Date()">
            Click me to display Date and Time.
        </button>

        <p id="demo_a"></p>

        <button type="button" onclick="document.getElementById('demo_b').innerHTML = 'Hello'">
            Click here to change text
        </button>

        <p id="demo_b">Hi</p>
    </body>
</html>
