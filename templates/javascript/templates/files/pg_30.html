<!-- 1.b. variables defined with let must be declared before use -->
<!-- 1.c. variables defined with let have block scope -->

<!-- 2.a. variables defined with var can be redeclared -->
<!-- 2.b. variables defined with var must be declared before use -->
<!-- 2.c. variables defined with var cannot have block scope -->
