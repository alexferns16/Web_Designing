<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Output: </p>
    <p id="demo_one"></p>

    <label for="fn">First Number: </label>
    <input type="text" id="fn" name="fnum">
    <label for="sn">Second Number: </label>
    <input type="text" id="sn" name="snum">
    <input type="submit" onclick="add()">

    <script>
       function add() {
           x = document.getElementById('fn').value;
           y = document.getElementById('sn').value;
           z = Number(x) + Number(y);
           document.getElementById('demo_one').innerHTML = z;
       }
    </script>
</body>
</html>
