<!DOCTYPE html>
<html>
    <head>
        <script type="text/javascript">  
            function getcube() {  
                var number = document.getElementById("number_num").value;  
                alert(number * number * number);  
            }
        </script>  
    </head>

    <body>
        <form>  
            <label for="number_num">Enter No: </label>
            <input type="text" id="number_num" name="number"><br>  
            <input type="button" value="Submit"onclick="getcube()">  
        </form>  
    </body>
</html>
