<!-- Reassigning an existing const variable, in the same scope, is not allowed -->

<html>
    <head>

    </head>

    <body>
        <p id="demo_one"></p>

        <script>
            const x = 2;          // Allowed
            // x = 2;             // Not allowed
            // var x = 2;         // Not allowed
            // let x = 2;         // Not allowed
            // const x = 2;       // Not allowed

            {
                // const x = 2;   // Allowed
                // x = 2;         // Not allowed
                // var x = 2;     // Not allowed
                // let x = 2;     // Not allowed
                // const x = 2;   // Not allowed
            }

            document.getElementById("demo_one").innerHTML = x;
        </script>
    </body>
</html>
