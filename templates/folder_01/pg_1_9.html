<!-- bdo: bi-directional orientation -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Bi-Directional Override -->
    <bdo dir="rtl">This is a text</bdo>
    <p dir="rtl">This is a text</p>
    <p dir="rtl"><bdo dir="rtl">This is a text</bdo></p>
    <p>This is a <!-- This is a comment -->paragraph</p>
</body>
</html>
