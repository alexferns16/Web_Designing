<html>
    <head>

        <!-- Character Encoding -->
        <meta charset="UTF-8">

        <!-- Responsive Design -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Page Title -->
        <title>My Website</title>

        <!-- SEO -->
        <meta name="description" content="Description of your website">
        <meta name="keywords" content="HTML, CSS, JavaScript, Web Development">
        <meta name="author" content="Alex Fernandes">
        <meta name="robots" content="index, follow">

        <!-- Browser Theme Color -->
        <meta name="theme-color" content="#ffffff">

        <!-- Favicon -->
        <link rel="icon" href="favicon.ico" type="image/x-icon">

        <!-- Apple Devices -->
        <link rel="apple-touch-icon" href="apple-touch-icon.png">

        <!-- CSS -->
        <link rel="stylesheet" href="style.css">

        <!-- External Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <!-- External Stylesheet Example -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

        <!-- Canonical URL -->
        <link rel="canonical" href="https://www.example.com">

        <!-- Open Graph (Facebook, LinkedIn) -->
        <meta property="og:title" content="My Website">
        <meta property="og:description" content="Website Description">
        <meta property="og:image" content="image.jpg">
        <meta property="og:url" content="https://www.example.com">
        <meta property="og:type" content="website">

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="My Website">
        <meta name="twitter:description" content="Website Description">
        <meta name="twitter:image" content="image.jpg">

        <!-- JavaScript -->
        <script src="script.js" defer></script>

    </head>
    <body>
        
    </body>
</html>

<!-- | Tag                             | Purpose                                                                                            |
| ------------------------------- | -------------------------------------------------------------------------------------------------- |
| `<meta charset>`                | Defines the character encoding (UTF-8 is standard).                                                |
| `<meta name="viewport">`        | Makes the page responsive on different devices.                                                    |
| `<title>`                       | Text shown in the browser tab and search results.                                                  |
| `<meta name="description">`     | Short description for search engines.                                                              |
| `<meta name="keywords">`        | Page keywords (largely ignored by modern search engines).                                          |
| `<meta name="author">`          | Specifies the page author.                                                                         |
| `<meta name="robots">`          | Tells search engines whether to index the page.                                                    |
| `<meta name="theme-color">`     | Sets the browser UI color on supported devices.                                                    |
| `<link rel="icon">`             | Displays the website icon in the browser tab.                                                      |
| `<link rel="apple-touch-icon">` | Icon used when adding the site to an iPhone/iPad home screen.                                      |
| `<link rel="stylesheet">`       | Loads an external CSS file.                                                                        |
| `<link rel="preconnect">`       | Speeds up connections to external resources.                                                       |
| `<link rel="canonical">`        | Indicates the preferred URL for SEO to avoid duplicate content.                                    |
| `<meta property="og:*">`        | Controls how the page appears when shared on social media.                                         |
| `<meta name="twitter:*">`       | Controls how the page appears when shared on X (formerly Twitter).                                 |
| `<script>`                      | Loads a JavaScript file. Using `defer` waits until the HTML is parsed before executing the script. | -->
