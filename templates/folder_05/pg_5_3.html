<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border: 2px solid black;
        width: 100%;
        height: 50%;
        border-collapse: collapse;
      }

      td,
      th {
        border: 2px solid black;
      }

      td {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <th></th>
        <th>Mon</th>
        <th>Tue</th>
        <th>Thu</th>
      </tr>

      <tr>
        <th>9-12</th>
        <td>Present</td>
        <td>Absent</td>
        <td>Present</td>
      </tr>

      <tr>
        <th>12-3</th>
        <td>Present</td>
        <td>Present</td>
        <td>Absent</td>
      </tr>

      <tr>
        <th>3-6</th>
        <td>Absent</td>
        <td>Present</td>
        <td>Present</td>
      </tr>
    </table>
  </body>
</html>
