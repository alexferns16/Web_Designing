<!-- CSS simple selectors > element.class selector -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .class_one {
            background-color: blue;
            color: white;
        }

        h1.class_one {
            background-color: bisque;
            color:black;
        }

        h1.class_two {
            background-color: aquamarine;
            color: darkgreen;
        }
    </style>
</head>
<body>
    <h1 class="class_one">This is paragraph 1</h1>
    <h1 class="class_two">This is paragraph 1</h1>
    <h2 class="class_one">This is paragraph 2</h2>
    <h3 class="class_one">This is paragraph 2</h3>
    <p class="class_one">This is paragraph 2</p>
</body>
</html>
