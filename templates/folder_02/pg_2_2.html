<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .col_one {
            color: crimson;
        }

        .col_two {
            color: hotpink;
        }

        .bcol_one {
            background-color: aqua;
        }

        .bcol_two {
            background-color: mediumseagreen;
        }

        .bor_one {
            border: 2px solid dodgerblue;
        }

        .bor_two {
            border: 5px double cadetblue;
        }
    </style>
</head>
<body>
    <h1 class="col_one bcol_one bor_one">This Is Heading One</h1>
    <h1 class="col_two bcol_one bor_one">This Is Heading Two</h1>
    <h1 class="col_two bor_two">This Is Heading Three</h1>
</body>
</html>
