<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .outer_container {
        border: 3px solid hotpink;
        width: 90%;
        height: 90vh;
        margin: 5vh 5%;

        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 5%;
      }

      .inner_container {
        border: 2px solid hotpink;
        width: 30%;
        height: 80%;
      }

      @media (max-width: 500px) {
        .outer_container {
          border: 3px solid hotpink;
          width: 90%;
          height: 90vh;
          margin: 5vh 5%;

          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 4vh;
        }

        .inner_container {
          border: 2px solid hotpink;
          width: 80%;
          height: 40vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="outer_container">
      <div class="inner_container"></div>
      <div class="inner_container"></div>
    </div>
  </body>
</html>
