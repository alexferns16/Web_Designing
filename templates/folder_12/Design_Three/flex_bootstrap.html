<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Version</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .outer_container {
        border: 3px solid hotpink;
        width: 90%;
        height: 90vh;
        margin: 5vh auto;
      }

      .inner_container {
        border: 2px solid hotpink;
        height: 80%;
      }

      @media (max-width: 500px) {
        .inner_container {
          height: 40vh; /* same as your original */
        }
      }
    </style>
  </head>
  <body>
    <div
      class="container outer_container d-flex flex-column flex-lg-row justify-content-center align-items-center gap-4"
    >
      <!-- Box 1 -->
      <div class="inner_container col-11 col-md-4"></div>
      <!-- Box 2 -->
      <div class="inner_container col-11 col-md-4"></div>
    </div>
  </body>
</html>
