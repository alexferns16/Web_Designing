<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .outer_container {
        display: grid;
        border: 4px solid hotpink;
        width: 100%;
        height: 90vh;

        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr;

        max-width: 90%;
        margin: 5vh 5%;
      }

      .inner_container {
        border: 2px solid hotpink;
        width: 80%;
        height: 80%;
        margin: auto;
      }

      div.inner_container:last-child {
        display: none;
      }

      @media (max-width: 768px) {
        .outer_container {
          display: grid;
          border: 4px solid hotpink;
          width: 100%;
          height: 100vh;

          grid-template-columns: 1fr 1fr 1fr;
          grid-template-rows: 1fr 1fr 1fr;

          max-width: 95%;
          margin: 5vh 2.5%;
        }

        .inner_container {
          border: 2px solid hotpink;
          width: 80%;
          height: 80%;
          margin: auto;
        }

        div.inner_container:last-child {
          display: block;
        }
      }

      @media (max-width: 500px) {
        .outer_container {
          display: grid;
          border: 4px solid hotpink;
          width: 100%;
          height: 100vh;

          grid-template-columns: 1fr 1fr;
          grid-template-rows: 1fr 1fr 1fr 1fr;

          max-width: 100%;
          margin: 5vh 0;
        }

        .inner_container {
          border: 2px solid hotpink;
          width: 80%;
          height: 80%;
          margin: auto;
        }

        div.inner_container:last-child {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="outer_container">
      <div class="inner_container"></div>
      <div class="inner_container"></div>
      <div class="inner_container"></div>
      <div class="inner_container"></div>
      <div class="inner_container"></div>
      <div class="inner_container"></div>
      <div class="inner_container"></div>
      <div class="inner_container"></div>
      <div class="inner_container"></div>
    </div>
  </body>
</html>
